<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link href="../dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/awesomplete/awesomplete.css" />
    <script src="./node_modules/awesomplete/awesomplete.min.js" async></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark')
    }
    </script>
</head> 
<body class="bg-gray-50 dark:bg-gray-900 transition delay-50 duration-200 ease-in-out">
    <header>
        <nav class="fixed top-0 z-50 w-full bg-gray-200 border-gray-200 dark:bg-gray-950 border-b border-gray-20 dark:border-b dark:border-gray-700">
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
                <a href="/pages/index.html" class="flex items-center space-x-3 rtl:space-x-reverse">
                    <span class="material-symbols-outlined dark:text-gray-200">wallet</span>
                    <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-gray-200">Budget Tracker</span>
                </a>
                <div class="flex flex-col justify-center ml-3">
                    <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <aside id="logo-sidebar" class="fixed top-0 left-0 z-40 w-60 h-screen pt-20 transition-transform -translate-x-full bg-white border-r border-gray-200 sm:translate-x-0 dark:bg-gray-800 dark:border-gray-700" aria-label="Sidebar">
        <div class="h-full px-3 pb-4 overflow-y-auto bg-white dark:bg-gray-800">
            <ul class="space-y-2 font-medium">
                <li>
                    <a href="/pages/index.html" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                    <span class="material-symbols-outlined text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white" aria-hidden="true" fill="currentColor" >dashboard</span>
                    <span class="ms-3">Home</span>
                    </a>
                </li>
                <li>
                    <a href="/pages/transaction.html" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                    <span class="material-symbols-outlined text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white" aria-hidden="true" fill="currentColor" >paid</span>
                    <span class="flex-1 ms-3 whitespace-nowrap">Transaction</span>
                    </a>
                </li>
                <li>
                    <a href="/pages/account.html" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                    <span class="material-symbols-outlined text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white" aria-hidden="true" fill="currentColor" >account_balance_wallet</span>
                    <span class="flex-1 ms-3 whitespace-nowrap">Account</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <section class="grid grid-cols-3 grid-rows-2 gap-2 fixed left-60 top-0 w-full h-screen pt-20 pl-2 pr-62 pb-2">
        <div class="bg-gray-200 dark:bg-gray-600 col-span-1 rounded-md flex flex-col p-3">
            <h1 class="text-gray-900 dark:text-white font-semibold text-lg mb-2">Quick ToolBar</h1>
            <div class="grid grid-cols-2 grid-rows-3 gap-3 w-full h-full text-sm">
                <button id="indexAddAccountToggleButton" class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-neutral-300 dark:bg-neutral-400 hover:bg-neutral-400 dark:hover:bg-neutral-500 rounded-lg col-span-1 text-gray-900 dark:text-white ">Account</button>
                <button id="indexAddCardToggleButton" class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-slate-300 dark:bg-slate-400 hover:bg-slate-400 dark:hover:bg-slate-500 rounded-lg col-span-1 text-gray-900 dark:text-white">Card</button>
                <button id="indexAddIncomeToggleButton" class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-slate-300 dark:bg-slate-400 hover:bg-slate-400 dark:hover:bg-slate-500 rounded-lg col-span-1 text-gray-900 dark:text-white">Income</button>
                <button class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-neutral-300 dark:bg-neutral-400 hover:bg-neutral-400 dark:hover:bg-neutral-500 rounded-lg col-span-1 text-gray-900 dark:text-white"></button>
                <button class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-neutral-300 dark:bg-neutral-400 hover:bg-neutral-400 dark:hover:bg-neutral-500 rounded-lg col-span-1 text-gray-900 dark:text-white"></button>
                <button class="font-semibold shadow flex justify-center items-center border border-gray-300 bg-slate-300 dark:bg-slate-400 hover:bg-slate-400 dark:hover:bg-slate-500 rounded-lg col-span-1 text-gray-900 dark:text-white"></button>
            </div>
        </div>
        <div class="bg-gray-200 dark:bg-gray-600 col-span-2 rounded-md"></div>
        <div class="bg-gray-200 dark:bg-gray-600 col-span-1 rounded-md"></div>
        <div class="bg-gray-200 dark:bg-gray-600 col-span-1 rounded-md"></div>
        <div class="bg-gray-200 dark:bg-gray-600 col-span-1 rounded-md"></div>


    </section>

    <!-- MODALS SECTION -->
    <div id="addAccountModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 bg-black/70 flex m-auto overflow-y-auto overflow-x-hidden top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

        <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                        Add New Account
                    </h3>
                    <button type="button" class="modalCloseButton text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <form id="addNewAccountForm" class="p-4 md:p-5">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2">
                            <label for="accountName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account Name</label>
                            <input type="text" name="name" id="accountName" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Chase 1234" required="">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="accountNickName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">NickName</label>
                            <input type="text" name="nickname" id="accountNickName" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="(Optional)">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="accounstType" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Type</label>
                            <select id="accounstType" name="type" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="" >
                                <option value="" selected disabled>Select account type</option>
                                <option value="checking">Checking</option>
                                <option value="savings">Savings</option>
                                <option value="cash">Cash</option>
                                <option value="investment">Investment</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="accountBalance" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Balance</label>
                            <input type="number" name="balance" id="accountBalance" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="0">
                        </div>

                        <div class="col-span-2 sm:col-span-1">
                            <label for="accountCurrency" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Currency</label>
                            <input list="currencyList" id="currencyInput" name="currency" placeholder="Enter Currency (USD)"
                            class="awesomplete bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
                                    dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" required>
                            <datalist id="currencyList"></datalist>
                        </div>
                    </div>
                    <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                        <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                        Add new account
                    </button>
                </form>
            </div>
        </div>
    </div> 

    <!-- MODALS SECTION -->
    <div id="addCardModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 bg-black/70 flex m-auto overflow-y-auto overflow-x-hidden top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

        <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                        Add Card
                    </h3>
                    <button type="button" class="modalCloseButton text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <form id="addCardForm" class="p-4 md:p-5">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2">
                            <label for="cardName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Card Name</label>
                            <input type="text" id="cardName" name="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Chase 1234 Debit" required="">
                        </div>
                        <div class="col-span-2">
                            <label for="cardType" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Type</label>
                            <select id="cardType" name="type" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="" >
                                <option value="" selected disabled>Select card type</option>
                                <option value="credit">credit</option>
                                <option value="debit">debit</option>
                            </select>
                        </div>
                        <div id="debitCardLinkedAccountContainer" class="hidden col-span-2">
                            <label for="indexLinkedAccount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Linked Account</label>
                            <select id="indexLinkedAccount" name="linkedAccount" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                                <option value="" selected disabled>Select linked Account</option>
                            </select>
                        </div>
                    </div>
                    <div id="creditCardInputContainer" class="hidden col-span-2 grid grid-cols-2 gap-4 mb-4">
                        <div class="col-span-2 sm:col-span-1">
                            <label for="creditBalance" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Credit Limit</label>
                            <input type="number" name="limit" id="creditLimit" name="creditLimit" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="5000">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="creditBalance" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Current Balnace</label>
                            <input type="number" name="balance" id="creditBalance" name="creditBalance" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="1000">
                        </div>
                    </div>
                    <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                        <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                        Add new card
                    </button>
                </form>
            </div>
        </div>
    </div> 


    <!-- MODALS SECTION -->
    <div id="addIncomeModal" tabindex="-1" aria-hidden="true" class="fixed inset-0 bg-black/70 flex m-auto overflow-y-auto overflow-x-hidden top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

        <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                        Add Income
                    </h3>
                    <button type="button" class="modalCloseButton text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <form id="addIncomeForm" class="p-4 md:p-5">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2 sm:col-span-1">
                            <label for="addIncomeCategorySelect" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category</label>
                            <select id="addIncomeCategorySelect" name="category" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="" >
                                <option value="" selected disabled>Select Income Category</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="addIncomeAccountSelect" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account</label>
                            <select id="addIncomeAccountSelect" name="account" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="" >
                                <option value="" selected disabled>Select account</option>
                                <option value="cash">cash</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label for="addIncomeAmountInput" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Amount</label>
                            <input type="number" name="amount" id="addIncomeAmountInput" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="10000">
                        </div>
                        <div class="col-span-2">
                            <label for="addIncomeNote" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Note</label>
                            <textarea id="addIncomeNote" name="note" rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write your note..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                        <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                        Add income
                    </button>
                </form>
            </div>
        </div>
    </div> 
    <link href="../node_modules/flowbite/dist/flowbite.min.css"></link>
    <script type="module" src="../static/scripts/main.js" rel="script"></script>
</body>
</html>
